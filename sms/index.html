<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Send SMS</title>
        <style>
            :root {
                --bg-1: #0b1120;
                --bg-2: #111827;
                --card-bg: rgba(17, 24, 39, 0.85);
                --primary: #60a5fa;
                --primary-dark: #3b82f6;
                --text: #e5e7eb;
                --muted: #9ca3af;
                --border: rgba(148, 163, 184, 0.2);
                --shadow: rgba(96, 165, 250, 0.15);
                --field-bg: #0f172a;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Arial, Helvetica, sans-serif;
                background: radial-gradient(
                    circle at top,
                    #1f2937 0%,
                    var(--bg-1) 35%,
                    var(--bg-2) 100%
                );
                color: var(--text);
            }

            .container {
                width: min(100%, 420px);
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 18px;
                box-shadow: 0 20px 45px var(--shadow);
                padding: 32px 28px;
                backdrop-filter: blur(12px);
            }

            h1 {
                margin: 0 0 24px;
                text-align: center;
                font-size: 2rem;
                color: var(--text);
            }

            form {
                display: flex;
                flex-direction: column;
                gap: 18px;
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            label {
                font-weight: 600;
                color: var(--muted);
            }

            input[type="tel"],
            input[type="number"] {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--field-bg);
                color: var(--text);
                font-size: 1rem;
                transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;
            }

            input[type="tel"]::placeholder,
            input[type="number"]::placeholder {
                color: var(--muted);
            }

            input[type="tel"]:focus,
            input[type="number"]:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
            }

            input[type="submit"] {
                margin-top: 8px;
                border: none;
                border-radius: 12px;
                background: linear-gradient(135deg, var(--primary), var(--primary-dark));
                color: #f8fafc;
                font-size: 1rem;
                font-weight: 700;
                padding: 14px 18px;
                cursor: pointer;
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
                box-shadow: 0 10px 20px rgba(59, 130, 246, 0.35);
            }

            input[type="submit"]:hover {
                transform: translateY(-1px);
            }

            #response {
                min-height: 24px;
                margin: 18px 0 0;
                text-align: center;
                font-weight: 600;
                color: var(--text);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Send SMS</h1>
            <form action="/send" method="post">
                <div class="field">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required />
                </div>
                <div class="field">
                    <label for="count">Number of Messages:</label>
                    <input
                        type="number"
                        id="count"
                        name="count"
                        min="1"
                        value="5"
                        max="10"
                        required
                    />
                </div>
                <input type="submit" value="Send SMS" />
            </form>
            <p id="response"></p>
        </div>
        <script>
            const phoneInput = document.getElementById("phone");
            const countInput = document.getElementById("count");
            const form = document.querySelector("form");
            form.addEventListener("submit", (event) => {
                event.preventDefault();
                const phoneNumber = phoneInput.value.trim();
                const count = parseInt(countInput.value, 10);
                if (
                    !phoneNumber ||
                    phoneNumber.length !== 11 ||
                    isNaN(count) ||
                    count < 1 ||
                    count > 10
                ) {
                    event.preventDefault();
                    alert("Please enter a valid phone number and a count between 1 and 10.");
                } else {
                    const responseElement = document.getElementById("response");
                    responseElement.textContent = "Sending SMS...";
                    responseElement.style.color = "blue";
                    fetch(
                        "https://cymbal-handwoven-parchment.ngrok-free.dev/sms?phone_number=" +
                            encodeURIComponent(phoneNumber) +
                            "&count=" +
                            encodeURIComponent(count),
                        {
                            headers: {
                                "ngrok-skip-browser-warning": "69420",
                            },
                        },
                    )
                        .then((response) => response.json())
                        .then((data) => {
                            console.log(data);
                            const responseElement = document.getElementById("response");
                            if (data.success == "OK") {
                                responseElement.textContent = "SMS sent successfully!";
                                responseElement.style.color = "green";
                            } else {
                                responseElement.textContent = "Failed to send SMS: " + data.error;
                                responseElement.style.color = "red";
                            }
                        })
                        .catch((error) => {
                            console.error("Error:", error);
                            const responseElement = document.getElementById("response");
                            responseElement.textContent =
                                "An error occurred while sending the SMS.";
                            responseElement.style.color = "red";
                        });
                }
            });
        </script>
    </body>
</html>
