<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Data Collection Form</title>
        <style>
            body {
                font-family: monospace;
                background-color: #f4f4f9;
                padding: 20px;
            }
            .container {
                max-width: 600px;
                margin: auto;
                background: white;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
            }
            input[type="text"],
            input[type="email"],
            input[type="number"],
            input[type="file"] {
                font-family: monospace;
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            }
            button {
                background: #28a745;
                color: white;
                border: none;
                padding: 10px 15px;
                font-size: 16px;
                cursor: pointer;
                border-radius: 5px;
                width: 100%;
            }
            button:hover {
                background: #218838;
            }
            #status {
                margin-top: 15px;
                font-weight: bold;
                text-align: center;
            }
            .hide {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Update Information</h2>

            <form id="dataForm">
                <div class="form-group">
                    <label>Roll Number *</label
                    ><input type="number" id="roll" required />
                </div>
                <div class="form-group">
                    <label>Name</label><input type="text" id="name" />
                </div>
                <div class="form-group">
                    <label>Photo</label
                    ><input type="file" id="photo" accept="image/*" />
                </div>
                <div class="form-group hide">
                    <label>Email</label><input type="email" id="email" />
                </div>
                <div class="form-group">
                    <label>Phone Number</label
                    ><input type="text" id="phone" />
                </div>
                <div class="form-group hide">
                    <label>WhatsApp Number</label
                    ><input type="number" id="whatsapp" />
                </div>
                <div class="form-group">
                    <label>District</label><input type="text" id="district" />
                </div>
                <div class="form-group">
                    <label>College Name</label
                    ><input type="text" id="college" />
                </div>
                <div class="form-group">
                    <label>Codeforces Username</label
                    ><input type="text" id="codeforces" />
                </div>
                <div class="form-group">
                    <label>LinkedIn Profile Link</label
                    ><input type="text" id="linkedin" />
                </div>
                <div class="form-group">
                    <label>GitHub Account Link</label
                    ><input type="text" id="github" />
                </div>
                <div class="form-group">
                    <label>Facebook Account Link</label
                    ><input type="text" id="facebook" />
                </div>

                <button type="submit" id="submitBtn">Update Data</button>
            </form>

            <div id="status"></div>
        </div>

        <script>
            // --- GOOGLE APPS SCRIPT WEB APP URL ---
            const SCRIPT_URL =
                "https://script.google.com/macros/s/AKfycbz4Pr2UwxPFOZoAoxXMLgKhno_BFi81eT4mP9SAU1u11W0v7yQfBKSglgmpDm_jOz5S/exec";

            let deviceIp = "";

            // Fetch IP automatically on load
            fetch("https://api.ipify.org?format=json")
                .then((response) => response.json())
                .then((data) => {
                    deviceIp = data.ip;
                })
                .catch((err) => console.error("Could not fetch IP", err));

            document
                .getElementById("dataForm")
                .addEventListener("submit", async function (e) {
                    e.preventDefault();

                    const btn = document.getElementById("submitBtn");
                    const statusDiv = document.getElementById("status");
                    btn.innerText = "Updating... Please wait";
                    btn.disabled = true;
                    statusDiv.innerText = "";

                    const payload = {
                        ip: deviceIp,
                        roll: document.getElementById("roll").value,
                        name: document.getElementById("name").value,
                        email: document.getElementById("email").value,
                        phone: document.getElementById("phone").value,
                        whatsapp: document.getElementById("whatsapp").value,
                        district: document.getElementById("district").value,
                        college: document.getElementById("college").value,
                        codeforces: document.getElementById("codeforces").value,
                        linkedin: document.getElementById("linkedin").value,
                        github: document.getElementById("github").value,
                        facebook: document.getElementById("facebook").value,
                        photoBase64: null,
                        photoMimeType: null,
                    };

                    const fileInput = document.getElementById("photo");

                    // Helper function to read file and send data
                    const sendData = () => {
                        fetch(SCRIPT_URL, {
                            method: "POST",
                            // Using text/plain overrides strict CORS preflights in Apps Script
                            headers: {
                                "Content-Type": "text/plain;charset=utf-8",
                            },
                            body: JSON.stringify(payload),
                        })
                            .then((response) => response.json())
                            .then((data) => {
                                if (data.status === "success") {
                                    statusDiv.style.color = "green";
                                    statusDiv.innerText = "Data updated";
                                    document.getElementById("dataForm").reset();
                                } else {
                                    throw new Error(data.message);
                                }
                            })
                            .catch((error) => {
                                statusDiv.style.color = "red";
                                statusDiv.innerText = "Error";
                                console.log(error.message);
                            })
                            .finally(() => {
                                btn.innerText = "Submit Data";
                                btn.disabled = false;
                            });
                    };

                    // If a file is attached, read it as Base64 first
                    if (fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        const reader = new FileReader();
                        reader.onload = function (event) {
                            const result = event.target.result; // Data URL
                            payload.photoMimeType = file.type;
                            payload.photoBase64 = result.split(",")[1]; // Get only the base64 string
                            sendData();
                        };
                        reader.readAsDataURL(file);
                    } else {
                        sendData(); // Send without photo
                    }
                });
        </script>
    </body>
</html>
