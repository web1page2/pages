<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update Data</title>
        <style>
            body {
                font-family: monospace;
                margin: 20px auto;
                max-width: 500px;
                padding: 20px;
                background-color: #f9f9f9;
            }
            h2 {
                color: #333;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
                color: #555;
            }
            input[type="text"],
            input[type="email"],
            input[type="file"] {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }
            button {
                flex: 1;
                padding: 11px;
                border: none;
                border-radius: 4px;
                font-weight: bold;
                color: #fff;
                cursor: pointer;
                width: 100%;
            }
            .btn-save {
                background-color: #28a745;
            }
            .btn-save:disabled {
                background-color: #6c757d;
                cursor: not-allowed;
            }
            button:hover:not(:disabled) {
                opacity: 0.9;
            }
            #response {
                margin-top: 20px;
                padding: 15px;
                background: #eef2f5;
                border-radius: 4px;
                font-family: monospace;
                white-space: pre-wrap;
                word-break: break-all;
                max-height: 300px;
                overflow-y: auto;
            }
            #previewImg {
                max-width: 150px;
                margin-top: 10px;
                display: none;
                border-radius: 4px;
            }
            .hide {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Data Collection Form</h2>
            <form id="crudForm">
                <div class="form-group">
                    <label>Roll*</label>
                    <input
                        type="text"
                        id="roll"
                        required
                        placeholder="Enter roll"
                    />
                </div>
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="name" placeholder="Full name" />
                </div>
                <div class="form-group">
                    <label>Photo:</label>
                    <input type="file" id="photo" accept="image/*" />
                    <img id="previewImg" alt="Preview" />
                </div>
                <div class="form-group hide">
                    <label>Email:</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                    />
                </div>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="text" id="phone" placeholder="Mobile number" />
                </div>
                <div class="form-group hide">
                    <label>WhatsApp Number:</label>
                    <input
                        type="text"
                        id="whatsapp"
                        placeholder="WhatsApp number"
                    />
                </div>
                <div class="form-group">
                    <label>District:</label>
                    <input
                        type="text"
                        id="district"
                        placeholder="District name"
                    />
                </div>
                <div class="form-group hide">
                    <label>Address:</label>
                    <input type="text" id="address" placeholder="Address" />
                </div>
                <div class="form-group">
                    <label>College Name:</label>
                    <input
                        type="text"
                        id="college"
                        placeholder="College name"
                    />
                </div>
                <div class="form-group">
                    <label>Facebook Profile Link:</label>
                    <input
                        type="text"
                        id="facebook"
                        placeholder="https://facebook.com/..."
                    />
                </div>
                <div class="form-group">
                    <label>Codeforces Handle:</label>
                    <input
                        type="text"
                        id="codeforces"
                        placeholder="Codeforces Username"
                    />
                </div>

                <div class="buttons">
                    <button
                        type="button"
                        class="btn-save"
                        id="submitBtn"
                        onclick="sendRequest('CREATE')"
                    >
                        Update
                    </button>
                </div>
            </form>

            <div id="response" class=""></div>
        </div>

        <script>
            // Replace with your current active deployment URL
            const SCRIPT_URL =
                "https://script.google.com/macros/s/AKfycbyz91up_gZc8EUs6o-SYufnEAQU35h-GeEG6LfcTSG0kRgqauQmylaWzVFN_Gk9Az3t/exec";

            async function getClientIp() {
                try {
                    const res = await fetch(
                        "https://api.ipify.org?format=json",
                    );
                    const data = await res.json();
                    return data.ip;
                } catch (e) {
                    return "127.0.0.1";
                }
            }

            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    if (!file) {
                        resolve(null);
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = () =>
                        resolve({
                            base64Data: reader.result.split(",")[1],
                            mimeType: file.type,
                            fileName: file.name,
                        });
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            async function sendRequest(action) {
                const btn = document.getElementById("submitBtn");
                const responseDiv = document.getElementById("response");
                const roll = document.getElementById("roll").value.trim();

                if (!roll) {
                    responseDiv.innerText = "Error: Roll field is required.";
                    return;
                }

                // UI Loading state
                btn.disabled = true;
                btn.innerText = "Updating...";
                responseDiv.innerText =
                    "Please wait, sending data to server...";

                try {
                    const clientIp = await getClientIp();
                    const photoInput =
                        document.getElementById("photo").files[0];
                    const photoFile = await fileToBase64(photoInput);

                    const payload = {
                        action: action,
                        clientIp: clientIp,
                        data: {
                            roll: roll,
                            name: document.getElementById("name").value,
                            email: document.getElementById("email").value,
                            phone: document.getElementById("phone").value,
                            whatsapp: document.getElementById("whatsapp").value,
                            district: document.getElementById("district").value,
                            address: document.getElementById("address").value,
                            codeforces:
                                document.getElementById("codeforces").value,
                            college: document.getElementById("college").value,
                            facebook: document.getElementById("facebook").value,
                            photoFile: photoFile,
                        },
                    };

                    const res = await fetch(SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" }, // Bypasses strict CORS preflight
                        body: JSON.stringify(payload),
                    });

                    const rawText = await res.text();
                    let json;

                    try {
                        json = JSON.parse(rawText);
                    } catch (parseErr) {
                        console.error("Raw Server Response:", rawText);
                        throw new Error(
                            "Server did not return valid JSON. Check the browser console to see what Google Apps Script returned. (Did you deploy the script correctly?)",
                        );
                    }

                    if (
                        json.status === "success" ||
                        json.result === "success"
                    ) {
                        responseDiv.innerText = "Data updated successfully!";
                    } else {
                        responseDiv.innerText =
                            "Server Error: " +
                            (json.message || JSON.stringify(json));
                    }
                } catch (err) {
                    responseDiv.innerText = "Request Failed: " + err.message;
                    console.error("Full Error:", err);
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Update";
                }
            }
        </script>
    </body>
</html>
