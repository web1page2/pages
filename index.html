<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Dashboard</title>
        <style>
            :root {
                --bg-color: #0d1117;
                --card-bg: rgba(22, 27, 34, 0.7);
                --card-border: rgba(255, 255, 255, 0.08);
                --card-border-hover: rgba(255, 255, 255, 0.08);
                --text-primary: #f0f6fc;
                --text-secondary: #8b949e;
                --accent-color: #58a6ff;
                --item-bg: rgba(33, 38, 45, 0.8);
                --item-hover-bg: rgba(48, 54, 61, 1);
                --sidebar-width: 260px;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: var(--bg-color);
                background-image: radial-gradient(circle at top right, #1f2937 0%, transparent 40%),
                                  radial-gradient(circle at bottom left, #111827 0%, transparent 40%);
                color: var(--text-primary);
                margin: 0;
                display: flex;
                min-height: 100vh;
                box-sizing: border-box;
            }

            /* Left Menu Sidebar */
            aside {
                width: var(--sidebar-width);
                background-color: var(--card-bg);
                backdrop-filter: blur(12px);
                border-right: 1px solid var(--card-border);
                display: flex;
                flex-direction: column;
                padding: 30px 20px;
                box-sizing: border-box;
                position: fixed;
                height: 100vh;
                overflow-y: auto;
                z-index: 100;
            }

            aside h2 {
                font-size: 1.2rem;
                font-weight: 600;
                margin: 0 0 24px 0;
                color: var(--text-primary);
                letter-spacing: 0.5px;
            }

            .menu-list {
                list-style: none;
                padding: 0;
                margin: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .menu-item {
                padding: 10px 14px;
                border-radius: 8px;
                cursor: pointer;
                color: var(--text-secondary);
                font-size: 0.95rem;
                font-weight: 500;
                text-transform: capitalize;
            }

            .menu-item:hover, .menu-item.active {
                background: var(--item-hover-bg);
                color: var(--text-primary);
            }

            /* Main Content Layout */
            main {
                margin-left: var(--sidebar-width);
                flex: 1;
                padding: 40px;
                box-sizing: border-box;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }

            #container {
                display: flex;
                flex-direction: column;
                gap: 24px;
                width: 100%;
                max-width: 900px;
            }

            .sub-container {
                display: flex;
                flex-wrap: wrap;
                align-content: flex-start;
                gap: 16px;
                padding: 20px;
                border: 1px solid var(--card-border);
                border-radius: 16px;
                box-sizing: border-box;
                background-color: var(--card-bg);
                backdrop-filter: blur(12px);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }

            .sub-container:hover {
                border-color: var(--card-border);
            }

            .header-wrapper {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                margin-bottom: 0;
            }

            .sub-container h3 {
                margin: 0;
                font-size: 1.1rem;
                font-weight: 600;
                color: var(--text-primary);
                text-transform: capitalize;
                letter-spacing: 0.5px;
            }

            .sub-container hr {
                width: 100%;
                border: none;
                border-top: 1px solid var(--card-border);
                margin: 12px 0 4px 0;
            }

            /* Link item styling */
            .link-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-decoration: none;
                color: var(--text-secondary);
                width: 72px;
                padding: 8px 4px;
                border-radius: 12px;
                box-sizing: border-box;
                position: relative;
            }

            .link-card:hover {
                color: var(--text-primary);
            }

            .icon-box {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 52px;
                height: 52px;
                background: var(--item-bg);
                border: 1px solid var(--card-border);
                border-radius: 14px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
                box-sizing: border-box;
            }

            .link-card:hover .icon-box {
                background: var(--item-hover-bg);
                border-color: var(--card-border);
            }

            .sub-container img {
                width: 28px;
                height: 28px;
                object-fit: contain;
            }

            .link-name {
                margin-top: 6px;
                font-size: 0.75rem;
                font-weight: 500;
                text-align: center;
                width: 100%;
                white-space: normal;
                word-break: break-word;
                line-height: 1.1;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
        </style>
    </head>

            let menuList = document.getElementById('menu-list');

            // Populate sidebar menu and content containers
            links.forEach(category => {
                let categoryNameFormatted = category.type.replace(/-/g, ' ');

                // Create menu item
                let menuItem = document.createElement('li');
                menuItem.classList.add('menu-item');
                menuItem.innerText = categoryNameFormatted;
                menuItem.onclick = () => filterCategory(category.type, menuItem);
                menuList.appendChild(menuItem);

                // Create content section
                let subContainer = document.createElement('div');
                subContainer.classList.add('sub-container');
                subContainer.setAttribute('data-category', category.type);
                
                let headerWrapper = document.createElement('div');
                headerWrapper.classList.add('header-wrapper');
                
                let title = document.createElement('h3');
                title.innerText = categoryNameFormatted;
                
                headerWrapper.appendChild(title);
                subContainer.appendChild(headerWrapper);

                let hr = document.createElement('hr');
                subContainer.appendChild(hr);

                category.links.forEach(link => {
                    let linkElement = document.createElement('a');
                    linkElement.href = link.url;
                    linkElement.target = '_blank';
                    linkElement.classList.add('link-card');
                    linkElement.innerHTML = `
                        <div class="icon-box">
                            <img src="${link.img}" alt="${link.name}">
                        </div>
                        <span class="link-name">${link.name}</span>
                    `;
                    subContainer.appendChild(linkElement);
                });

                container.appendChild(subContainer);
            });

            // Filter function for sidebar navigation
            function filterCategory(type, element) {
                // Update active state in menu
                document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
                element.classList.add('active');

                // Show/hide sections based on selection
                let sections = document.querySelectorAll('.sub-container');
                sections.forEach(section => {
                    if (type === 'all' || section.getAttribute('data-category') === type) {
                        section.style.display = 'flex';
                    } else {
                        section.style.display = 'none';
                    }
                });
            }
